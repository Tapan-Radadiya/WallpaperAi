version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: wallpaper_pg
    environment:
      POSTGRES_USER: tapan
      POSTGRES_PASSWORD: tapan_wall
      POSTGRES_DB: wallpaperDB
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: wallpaper_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    
volumes:
  postgres_data:
  redis_data: