services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: wallpaper_pg
    environment:
      POSTGRES_USER: tapan
      POSTGRES_PASSWORD: tapan_wall
      POSTGRES_DB: wallpaperDB
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: wallpaper_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
  
  prometheus:
    image: prom/prometheus:latest
    container_name: promethus_data_scraper
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
  
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana-data-visualizer
    ports:
      - "5000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
  
  grafana-loki:
    image: grafana/loki:3.7.0
    container_name: grafana-loki-log-collector
    ports:
      - "3100:3100"
    volumes:
      - grafana-loki-data:/var/lib/grafana-loki
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana-data:
  grafana-loki-data: