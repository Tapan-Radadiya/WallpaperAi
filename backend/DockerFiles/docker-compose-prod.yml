version: '3.8'
services:
  backend:
    container_name: wallpaper_backend
    build:
      context: ../
    ports:
      - "3002:3002"
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: wallpaper_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
  
  prometheus:
    image: prom/prometheus:latest
    container_name: promethus_data_scraper
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
  
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana-data-visualizer
    ports:
      - "5000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
  
  grafana-loki:
    image: grafana/loki:3.7.0
    container_name: grafana-loki-log-collector
    ports:
      - "3100:3100"
    volumes:
      - grafana-loki-data:/var/lib/grafana-loki
    
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana-data:
  grafana-loki-data: